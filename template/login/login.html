<style>
        .bg-light-weave {
            background-color: #faf8f2;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.25), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.15), transparent 50%),
                linear-gradient(rgba(14, 165, 233, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, -1px -1px, -1px -1px;
        }
        
        .glass-card {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .industrial-input {
            background-color: #f5f3f6;
            border: none;
            border-bottom: 2px solid #c4c6cf;
            transition: all 0.3s ease;
        }
        .industrial-input:focus {
            border-bottom: 2px solid #356381;
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(53, 99, 129, 0.1);
            background-color: #ffffff;
        }
    </style>

<body class="h-full bg-light-weave flex flex-col font-body-md text-on-surface antialiased overflow-hidden">
<!-- Suppressed Top Nav as this is a Transactional/Linear Login Screen -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-container-max mx-auto relative z-10">
<div class="glass-card w-full max-w-md rounded-xl p-8 md:p-10 flex flex-col items-center relative animate-fade-in-up">
<!-- Connection Status Hint -->
<div class="absolute top-6 right-6 flex items-center space-x-2">
<div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" title="System Online"></div>
<span class="font-label-xs text-label-xs text-on-surface-variant uppercase tracking-widest">Active</span>
</div>
<!-- Brand Header -->
<div class="flex flex-col items-center mb-8 w-full text-center">
<div class="w-16 h-16 mb-4 rounded-lg flex items-center justify-center bg-primary-container p-2 shadow-sm border border-outline-variant/30">
<img alt="Lumina SafeGuard Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkHQNrqcBeh4ckSwAfRLWmT2_t43p67FT6oPvNoVED_JpAx5FFIS7RQhAQjUkUw9XC_7JdM-88WiupJvi8d6pNjItCm7985KBv7AQ4i1vRNhlINHf-Cu1d7PeVuyC9Gb-rGWBzTxOLx0Ui4H1CaQ0sYaFXLflcpfoBgjq25Tpn6zk9XDJdvx4V9lyZSMtptO-owx3ZAMel2G4ZoLmtI7T5ngqSEwGmJP53GgxwCBUCcBgfsxeCqyjV"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary font-bold tracking-tight mb-2">LOGIN</h1>
<p class="font-body-md text-body-md text-on-surface-variant">ACDLL SafeGuard</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6">
<div class="space-y-2 group">
<label class="block font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-secondary transition-colors uppercase tracking-wider" for="email">Operator ID / Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 bottom-3 text-outline group-focus-within:text-secondary transition-colors" data-icon="badge">badge</span>
<input class="industrial-input block w-full pl-8 pr-3 py-3 font-body-md text-on-surface placeholder:text-outline-variant rounded-t-DEFAULT" id="email" name="email" placeholder="admin@facility.local" required="" type="email"/>
</div>
</div>
<div class="space-y-2 group">
<label class="block font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-secondary transition-colors uppercase tracking-wider" for="password">Access Protocol</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 bottom-3 text-outline group-focus-within:text-secondary transition-colors" data-icon="lock">lock</span>
<input class="industrial-input block w-full pl-8 pr-10 py-3 font-body-md text-on-surface placeholder:text-outline-variant rounded-t-DEFAULT" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-2 bottom-3 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary-container focus:ring-primary-container focus:ring-offset-background bg-surface-container-low cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="remember-me">Stay connected</label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors hover:underline underline-offset-4" href="#">Recover Access</a>
</div>
</div>
<div class="pt-4">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-title-md text-title-md font-semibold text-on-primary bg-primary-container hover:bg-primary hover:shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined mr-2 text-[20px]" data-icon="lock">lock</span>
System Access
                    </button>
</div>
</form>
<!-- Sensor Monitoring Hint -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 w-full flex items-center justify-center space-x-6">
<div class="flex items-center">

<label class="ml-2 block font-label-sm text-label-sm text-on-surface-variant">Dont have an access?</label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors hover:underline underline-offset-4" href="https://www.facebook.com/cinanyag">Contact Administrator</a>
</div>
</div>
</div>
</main>
<!-- Suppressed Footer Nav as this is a Transactional Login Screen -->
</body></html>
